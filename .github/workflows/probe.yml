name: root probe

# 只构建 tools/rootprobe 这个独立小工程，与主 App 完全无关。
on:
  push:
    paths:
      - 'tools/rootprobe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build probe APK
        id: build
        continue-on-error: true
        working-directory: tools/rootprobe
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "gradle_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-build-log
          path: tools/rootprobe/build.log
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootprobe-apk
          path: tools/rootprobe/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Fail if gradle failed
        if: steps.build.outcome == 'failure'
        run: exit 1
